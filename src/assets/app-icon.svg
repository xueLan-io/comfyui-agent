    <circle cx="64.3" cy="225.9" r="14" fill="#FFFFFF"/>
    <circle cx="186.2" cy="173.3" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
    <circle cx="186.2" cy="173.3" r="14" fill="#FFFFFF"/>
  </g>

  <path d="M 256 112 C 268 168 276 204 296 225 C 318 241 354 247 404 256 C 354 265 318 271 296 287 C 276 308 268 344 256 400 C 244 344 236 308 216 287 C 194 271 158 265 108 256 C 158 247 194 241 216 225 C 236 204 244 168 256 112 Z"
