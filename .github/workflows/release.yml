name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "Tag $tag does not match package version $pkg" }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Prepare packaging-only ComfyUI root
        shell: pwsh
        run: |
          $portableRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'comfyui-packaging-root'
          New-Item -ItemType Directory -Force -Path (Join-Path $portableRoot 'python_embeded') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $portableRoot 'ComfyUI') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $portableRoot 'python_embeded\python.exe') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $portableRoot 'ComfyUI\main.py') | Out-Null
      - name: Build portable package
        shell: cmd
        env:
          CI: true
        run: pack-portable.bat
      - name: Build application update package
        shell: cmd
        run: pack-update.bat
      - name: Prepare Authenticode certificate
        shell: pwsh
        env:
          RELEASE_CERT_BASE64: ${{ secrets.RELEASE_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERT_BASE64)) {
            Write-Host 'Authenticode certificate not configured; continuing with Ed25519 manifest signing only.'
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release-signing.pfx", [Convert]::FromBase64String($env:RELEASE_CERT_BASE64))
          "RELEASE_CERT=$env:RUNNER_TEMP\release-signing.pfx" >> $env:GITHUB_ENV
          $signTool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe was not found' }
          "RELEASE_SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_ENV
      - name: Rebuild signed portable package
        shell: cmd
        env:
          CI: true
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: pack-portable.bat
      - name: Generate release manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          $env:RELEASE_VERSION = $env:RELEASE_VERSION.TrimStart('v')
          npm run release:manifest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ComfyMuse-portable-v*.zip
            ComfyMuse-update-v*.zip
            manifest-*.json
            manifest-*.json.sig
            SHA256SUMS.txt
