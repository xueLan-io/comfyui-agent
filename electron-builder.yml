appId: com.comfyui.agent
productName: "ComfyMuse"
executableName: "ComfyMuse"
artifactName: "ComfyMuse-${version}-Setup.${ext}"
copyright: Copyright 2026
icon: electron/icon.ico
directories:
  output: releases
files:
  - electron/**/*
  - comfy-client.mjs
  - dist/**/*
  - src/**/*
  - !src/fonts/**
  - package.json
  - workflows/**/*
extraResources:
  - from: src/fonts/LICENSE-Nowar.txt
    to: fonts/LICENSE-Nowar.txt
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE
win:
  icon: electron/icon.ico
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
