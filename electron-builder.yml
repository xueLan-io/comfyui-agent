appId: com.comfyui.agent
productName: "ComfyMuse"
executableName: "ComfyMuse"
artifactName: "ComfyMuse-${version}-Setup.${ext}"
copyright: Copyright 2026
icon: electron/icon.ico
directories:
  output: releases
files:
  - electron/**/*
  - comfy-client.mjs
  - dist/**/*
  - src/**/*
  - package.json
  - workflows/**/*
win:
  icon: electron/icon.ico
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
